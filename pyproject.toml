[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "snowball-portfolio-lab"
version = "0.1.0"
description = "Reproducible dynamic portfolio backtesting engine"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "streamlit>=1.41,<2",
  "yfinance>=0.2.54,<2",
  "exchange-calendars>=4.5,<5",
]

[project.scripts]
snowball = "snowball.cli:main"

[tool.poetry]
# Streamlit Cloud may invoke Poetry when it finds pyproject.toml.  The app is
# imported directly from the repository root, so Poetry must manage only the
# dependencies instead of looking for a package named after the distribution.
package-mode = false

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["snowball*"]

[tool.setuptools.package-data]
"snowball.data" = ["data/*.csv"]

